<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The Strongest Gunmaster | 3D Mobile Battlegrounds</title><meta name="description" content="Play The Strongest Gunmaster, a 3D mobile browser battleground game with guns, jumping, awakening and a titan boss."><meta name="theme-color" content="#101728"><style>*{box-sizing:border-box;touch-action:none}body{margin:0;overflow:hidden;background:#101728;font-family:Arial;color:white}#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:bold;text-shadow:1px 2px 4px #000}#health{position:absolute;top:42px;left:12px;width:155px;height:15px;background:#481c2a;border:2px solid white;border-radius:10px;overflow:hidden}#hpfill{height:100%;width:100%;background:#38e77b}#notice{position:absolute;top:22%;width:100%;text-align:center;font-weight:900;font-size:22px;text-shadow:0 3px 8px #000;pointer-events:none}#joy{position:absolute;bottom:28px;left:23px;width:132px;height:132px;border-radius:50%;background:#ffffff2b;border:3px solid #ffffff55}#stick{position:absolute;width:57px;height:57px;border-radius:50%;background:#ffffff99;left:35px;top:35px}button{position:absolute;border:2px solid #ffffff77;border-radius:50%;background:#334b88cc;color:white;font-weight:900;font-size:14px;box-shadow:0 3px 12px #0008}#fire{bottom:48px;right:24px;width:95px;height:95px;background:#e24455dd}#jump{bottom:150px;right:105px;width:70px;height:70px;background:linear-gradient(135deg,#26c9d9,#2864d9)}#dash{bottom:155px;right:24px;width:68px;height:68px}#switch{bottom:30px;right:137px;width:65px;height:65px}#awaken{bottom:240px;right:24px;width:85px;height:85px;background:#7034aa;opacity:.5}#help{position:absolute;bottom:7px;left:173px;font-size:11px;color:#eee;pointer-events:none}#loading{position:absolute;inset:0;background:#121a2c;display:flex;align-items:center;jus p:27px}#help{display:none}#fire{width:82px;height:82px}#awaken{bottom:245px}} </style></head><body><div id="loading"><h1>⚡ THE STRONGEST GUNMASTER</h1><p>3D BATTLEGROUNDS • MOBILE EDITION</p><div id="loadbar"><div id="loadfill"></div></div><div id="menu"><p>BUILD YOUR AVATAR</p><div id="options"><label>OUTFIT<select id="outfit"><option value="328dff">Electric Blue</option><option value="f047b4">Neon Pink</option><option value="26cfa9">Cyber Mint</option><option value="ffc347">Golden</option></select></label><label>HAIR<select id="hair"><option value="1b1b2e">Midnight</option><option value="c47a35">Brown</option><option value="fff0a3">Blonde</option><option value="b653ed">Purple</option></select></label></div><button id="start">▶ ENTER ARENA</button><p>10 KILLS = AWAKEN • 50 KILLS = BOSS • BOSS = GRENADE</p></div></div><div id="hud"><span id="score">💀 Kills: 0 / 10</span><span id="gun">🔫 RIFLE</span></div><div id="health"><div id="hpfill"></div></div><div id="notice"></div><div id="bosslabel">☠ THE TITAN • BOSS</div><div id="bossbar"><div id="bossfill"></div></div><div id="cross">+</div><div id="joy"><div id="stick"></div></div><button id="fire">FIRE</button><button id="jump">⬆ JUMP</button><button id="dash">DASH</button><button id="switch">GUN</button><button id="awaken">AWAKEN</button><button id="grenade">💣<br>GRENADE</button><div id="help">Drag right side to rotate camera</div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script><script>
(()=>{const loading=document.getElementById('loading');if(!window.THREE){loading.innerHTML='Could not load the 3D engine.<br>Connect to the internet and reopen the file.';return}document.getElementById('loadfill').style.width='100%';document.getElementById('menu').style.display='flex';const scene=new THREE.Scene();scene.background=new THREE.Color(0x101e45);scene.fog=new THREE.Fog(0x101e45,48,100);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,160);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x465ba3,2));const sun=new THREE.DirectionalLight(0xa4caff,2.3);sun.position.set(15,35,20);scene.add(sun);const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.8});const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(0x242e52));ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(120,30,0x27c5ff,0x344a80);grid.position.y=.012;scene.add(grid);const neon=new THREE.PointLight(0x5e50ff,65,40);neon.position.set(0,8,0);scene.add(neon);const obstacles=[];function box(x,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,h/2,z);scene.add(m);obstacles.push({x,z,w,d});const trim=new THREE.Mesh(new THREE.BoxGeometry(w+.07,.12,d+.07),new THREE.MeshBasicMaterial({color:0x4bceff}));trim.position.set(x,h+.08,z);scene.add(trim);return m}for(let i=0;i<25;i++){let x=(Math.random()-.5)*95,z=(Math.random()-.5)*95;if(Math.hypot(x,z)<13)continue;box(x,z,3+Math.random()*5,2+Math.random()*7,3+Math.random()*5,[0x8d98a5,0x76879c,0xa0a9a8][i%3])}for(let i=-1;i<=1;i++){box(-60,i*40,2,10,40,0x555d70);box(60,i*40,2,10,40,0x555d70);box(i*40,-60,40,10,2,0x555d70);box(i*40,60,40,10,2,0x555d70)}function character(color){const group=new THREE.Group();const suit=mat(color),skin=mat(0xf2bc91),dark=mat(0x17233d),metal=mat(0x354762),glow=new THREE.MeshStandardMaterial({color:0x35dfff,emissive:0x0a7fba,emissiveIntensity:1.2});function part(geo,m,x,y,z,parent=group){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);parent.add(o);return o}function cube(w,h,d,m,x,y,z,parent){return part(new THREE.BoxGeometry(w,h,d),m,x,y,z,parent)}const torso=cube(.88,.85,.43,suit,0,1.38,0);cube(.92,.14,.49,metal,0,1.81,0);cube(.68,.14,.47,dark,0,.91,0);const hair=part(new THREE.BoxGeometry(.53,.16,.53),mat(0x20202e),0,2.23,0);cube(.55,.52,.48,skin,0,2.01,0);cube(.6,.13,.51,hair.material,0,2.29,-.01);for(let x of [-.15,.15]){cube(.07,.065,.025,dark,x,2.04,-.251)}cube(.15,.035,.025,dark,0,1.9,-.255);for(let side of [-1,1]){let arm=new THREE.Group();arm.position.set(side*.59,1.7,0);group.add(arm);cube(.28,.48,.32,suit,0,-.25,0,arm);cube(.25,.16,.3,metal,0,-.52,0,arm);cube(.23,.19,.27,skin,0,-.7,0,arm);let leg=new THREE.Group();leg.position.set(side*.24,.89,0);group.add(leg);cube(.36,.58,.39,dark,0,-.29,0,leg);cube(.38,.19,.42,metal,0,-.57,0,leg);cube(.4,.22,.62,dark,0,-.79,-.11,leg);leg.userData.walkLeg=true;arm.userData.walkArm=true;arm.userData.side=side;leg.userData.side=side}cube(.44,.28,.15,metal,0,1.43,.29);cube(.18,.12,.07,glow,0,1.45,.38);const gunGroup=new THREE.Group();gunGroup.position.set(.46,1.28,-.38);group.add(gunGroup);cube(.23,.23,.85,dark,0,0,-.18,gunGroup);cube(.13,.15,.32,metal,0,.16,-.03,gunGroup);cube(.12,.16,.23,metal,0,-.19,.08,gunGroup);cube(.13,.13,.15,glow,0,0,-.63,gunGroup);group.userData={torso,hair,limbs:group.children.filter(c=>c.userData.walkLeg||c.userData.walkArm)};scene.add(group);return group}const player=character(0x328dff);const bots=[];let hp=100,kills=0,totalKills=0,boss=null,grenadeUnlocked=false,grenadeCooldown=0,awake=false,awakeUntil=0,gunIndex=0,shotAt=0,dashUntil=0,invuln=0,yaw=0,pitch=.23,moveX=0,moveY=0,firing=false,jumpVelocity=0,grounded=true;const guns=[{name:'RIFLE',delay:140,damage:25},{name:'PISTOL',delay:310,damage:43},{name:'BLASTER',delay:500,damage:65}];const score=document.getElementById('score'),gunEl=document.getElementById('gun'),hpfill=document.getElementById('hpfill'),awBtn=document.getElementById('awaken'),notice=document.getElementById('notice');let noticeTimeout;function message(t){notice.textContent=t;clearTimeout(noticeTimeout);noticeTimeout=setTimeout(()=>notice.textContent='',1800)}function summonBoss(){if(boss)return;boss={mesh:character(0xff265d),hp:1800,shootAt:0};boss.mesh.scale.set(2.5,2.5,2.5);boss.mesh.position.set(0,0,-32);scene.add(boss.mesh);document.getElementById('bossbar').style.display='block';document.getElementById('bosslabel').style.display='block';message('☠ TITAN BOSS HAS ARRIVED!')}function defeatBoss(){scene.remove(boss.mesh);boss=null;grenadeUnlocked=true;document.getElementById('grenade').style.display='block';document.getElementById('bossbar').style.display='none';document.getElementById('bosslabel').style.display='none';message('🏆 BOSS DEFEATED • GRENADE UNLOCKED!')}function spawn(){const b={mesh:character(0xff5b66),hp:100,shootAt:0,dir:Math.random()*6.28};let a=Math.random()*6.28,r=15+Math.random()*32;b.mesh.position.set(Math.cos(a)*r,0,Math.sin(a)*r);bots.push(b)}for(let i=0;i<7;i++)spawn();const bullets=[];function bullet(start,dir,friendly,damage){const mesh=new THREE.Mesh(new THREE.SphereGeometry(friendly?.14:.19,8,6),new THREE.MeshBasicMaterial({color:friendly?(awake?0xca6aff:0xffdf57):0xff4c44}));mesh.position.copy(start);scene.add(mesh);bullets.push({mesh,vel:dir.clone().multiplyScalar(friendly?39:18),friendly,damage,life:1.7})}function shoot(){let now=performance.now();let g=guns[gunIndex];if(now-shotAt<g.delay/(awake?1.9:1))return;shotAt=now;const origin=player.position.clone().add(new THREE.Vector3(.3,1.35,-.4).applyAxisAngle(new THREE.Vector3(0,1,0),yaw));let dir=new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));let target=null,nearest=.3;for(const b of bots){let to=b.mesh.position.clone().add(new THREE.Vector3(0,1.2,0)).sub(origin);let angle=dir.angleTo(to);if(angle<nearest&&to.length()<40){nearest=angle;target=to}}if(boss){let to=boss.mesh.position.clone().add(new THREE.Vector3(0,3,0)).sub(origin);if(dir.angleTo(to)<nearest&&to.length()<55){target=to}}if(target)dir.lerp(target.normalize(),.83).normalize();bullet(origin,dir,true,g.damage*(awake?2:1));if(awake&&gunIndex===2){bullet(origin,dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0),.13),true,g.damage);bullet(origin,dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0),-.13),true,g.damage)}}function collides(p){if(Math.abs(p.x)>57||Math.abs(p.z)>57)return true;return obstacles.some(o=>Math.abs(p.x-o.x)<o.w/2+.5&&Math.abs(p.z-o.z)<o.d/2+.5)}const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyId=null,lookId=null,lastLook=null;joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);updateJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)updateJoy(e)});function updateJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.max(1,Math.hypot(dx,dy)),scale=Math.min(l,48)/l;moveX=dx*scale/48;moveY=dy*scale/48;stick.style.transform=`translate(${dx*scale}px,${dy*scale}px)`}function endJoy(){joyId=null;moveX=moveY=0;stick.style.transform=''}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.33)return;lookId=e.pointerId;lastLook=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(lookId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;yaw-=(e.clientX-lastLook[0])*.006;pitch=Math.max(-.25,Math.min(.65,pitch+(e.clientY-lastLook[1])*.003));lastLook=[e.clientX,e.clientY]});renderer.domElement.addEventListener('pointerup',()=>lookId=null);document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();firing=true;shoot()});for(const evt of ['pointerup','pointercancel','pointerleave'])document.getElementById('fire').addEventListener(evt,()=>firing=false);document.getElementById('start').onclick=()=>{player.userData.torso.material.color.set('#'+document.getElementById('outfit').value);player.userData.outfit=parseInt(document.getElementById('outfit').value,16);player.userData.hair.material.color.set('#'+document.getElementById('hair').value);loading.remove()};document.getElementById('grenade').onclick=()=>{let now=performance.now();if(!grenadeUnlocked||now<grenadeCooldown)return;grenadeCooldown=now+6500;let pos=player.position.clone().add(new THREE.Vector3(-Math.sin(yaw)*9,0,-Math.cos(yaw)*9));let boom=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xffb139,transparent:true,opacity:.7}));boom.position.copy(pos).add(new THREE.Vector3(0,1,0));scene.add(boom);for(let b of [...bots])if(b.mesh.position.distanceTo(pos)<8){b.hp-=130;if(b.hp<=0){scene.remove(b.mesh);bots.splice(bots.indexOf(b),1);kills++;totalKills++;setTimeout(spawn,900)}}if(boss&&boss.mesh.position.distanceTo(pos)<9){boss.hp-=220;if(boss.hp<=0)defeatBoss()}let born=performance.now();let anim=()=>{let t=(performance.now()-born)/380;if(t>=1){scene.remove(boom);return}boom.scale.setScalar(1+t*7);boom.material.opacity=.7*(1-t);requestAnimationFrame(anim)};anim();message('💥 GRENADE BLAST!')};document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(grounded){jumpVelocity=10.5;grounded=false}});document.getElementById('dash').onclick=()=>{dashUntil=performance.now()+350};document.getElementById('switch').onclick=()=>{gunIndex=(gunIndex+1)%3;gunEl.textContent='🔫 '+guns[gunIndex].name};awBtn.onclick=()=>{if(kills<10||awake)return;awake=true;awakeUntil=performance.now()+30000;hp=Math.min(100,hp+45);kills=0;message('⚡ AWAKENING ACTIVATED!');awBtn.style.opacity=.5};function updateHud(){score.textContent='💀 '+totalKills+' TOTAL  •  ⚡ '+kills+'/10';hpfill.style.width=hp+'%';awBtn.style.opacity=kills>=10&&!awake?1:.5;awBtn.textContent=awake?'POWER': 'AWAKEN'}const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.04),now=performance.now();if(awake&&now>awakeUntil){awake=false;message('Awakening ended')}if(firing)shoot();let speed=now<dashUntil?24:8;let fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let v=fwd.multiplyScalar(-moveY).add(right.multiplyScalar(moveX));if(v.length()>1)v.normalize();let next=player.position.clone().addScaledVector(v,speed*dt);if(!collides(next))player.position.copy(next);if(!grounded){jumpVelocity-=25*dt;player.position.y+=jumpVelocity*dt;if(player.position.y<=0){player.position.y=0;jumpVelocity=0;grounded=true}}player.rotation.y=yaw;for(const limb of player.userData.limbs){limb.rotation.x=Math.sin(now*.011+ (limb.userData.side===1?Math.PI:0))*(v.length()>.1?.48:0)*(limb.userData.walkArm?-1:1)}player.userData.torso.material.color.setHex(awake?0xb357ff:(player.userData.outfit||0x328dff));for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.life-=dt;b.mesh.position.addScaledVector(b.vel,dt);let hit=false;if(b.mesh.position.y<0||b.life<=0||collides(b.mesh.position))hit=true;if(!hit&&b.friendly){for(let j=bots.length-1;j>=0;j--){let enemy=bots[j];if(b.mesh.position.distanceTo(enemy.mesh.position.clone().add(new THREE.Vector3(0,1.2,0)))<.85){enemy.hp-=b.damage;hit=true;if(enemy.hp<=0){scene.remove(enemy.mesh);bots.splice(j,1);kills++;totalKills++;if(totalKills===50)summonBoss();message(kills>=10?'🔥 AWAKENING READY!':'+1 KILL');setTimeout(spawn,900)}break}}}else if(!hit&&!b.friendly&&b.mesh.position.distanceTo(player.position.clone().add(new THREE.Vector3(0,1.2,0)))<.8){hit=true;if(now>invuln){hp=Math.max(0,hp-(awake?5:12));invuln=now+400;if(hp<=0){hp=100;kills=0;awake=false;player.position.set(0,0,0);jumpVelocity=0;grounded=true;message('RESPAWNED!')}}}if(!hit&&b.friendly&&boss&&b.mesh.position.distanceTo(boss.mesh.position.clone().add(new THREE.Vector3(0,3,0)))<2.4){boss.hp-=b.damage;hit=true;if(boss.hp<=0)defeatBoss()}if(hit){scene.remove(b.mesh);bullets.splice(i,1)}}for(let b of bots){let to=player.position.clone().sub(b.mesh.position),dist=to.length();b.mesh.rotation.y=Math.atan2(-to.x,-to.z);if(dist>7&&dist<38){let np=b.mesh.position.clone().addScaledVector(to.normalize(),dt*2.4);if(!collides(np))b.mesh.position.copy(np)}if(dist<25&&now>b.shootAt){b.shootAt=now+1100+Math.random()*800;let from=b.mesh.position.clone().add(new THREE.Vector3(0,1.3,0));let direction=player.position.clone().add(new THREE.Vector3(0,1.2,0)).sub(from).normalize();bullet(from,direction,false,12)}}if(boss){let to=player.position.clone().sub(boss.mesh.position),dist=to.length();boss.mesh.rotation.y=Math.atan2(-to.x,-to.z);if(dist>9){let np=boss.mesh.position.clone().addScaledVector(to.normalize(),dt*2);if(!collides(np))boss.mesh.position.copy(np)}if(dist<35&&now>boss.shootAt){boss.shootAt=now+650;let from=boss.mesh.position.clone().add(new THREE.Vector3(0,3,0));for(let a of [-.18,0,.18])bullet(from,player.position.clone().add(new THREE.Vector3(0,1,0)).sub(from).normalize().applyAxisAngle(new THREE.Vector3(0,1,0),a),false,15)}document.getElementById('bossfill').style.width=Math.max(0,boss.hp/1800*100)+'%'}let camOffset=new THREE.Vector3(Math.sin(yaw)*6,4.1+pitch*5,Math.cos(yaw)*6);camera.position.lerp(player.position.clone().add(camOffset),Math.min(1,dt*9));camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1.6+pitch*4,0)));updateHud();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();</script></body></html>
